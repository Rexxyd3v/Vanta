name: Build and Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-miniaudio

      - name: Check dependencies
        shell: msys2 {0}
        run: |
          echo "=== GCC ==="
          g++ --version

          echo "=== Raylib ==="
          pkg-config --modversion raylib

          echo "=== ENet ==="
          pkg-config --modversion libenet || pkg-config --modversion enet

          echo "=== Opus ==="
          pkg-config --modversion opus

          echo "=== Miniaudio ==="
          pkg-config --modversion miniaudio || true

      - name: Build Rgamestudio
        shell: msys2 {0}
        run: |
          mkdir -p bin

          g++ \
            -I. \
            src/*.cpp \
            src/screens/*.cpp \
            src/utils/*.cpp \
            src/map_loader/*.cpp \
            src/map_loader/scenes/*.cpp \
            src/entities/*.cpp \
            src/network/*.cpp \
            src/ui/*.cpp \
            src/voice/*.cpp \
            -std=c++17 \
            -O2 \
            -o bin/Rgamestudio.exe \
            $(pkg-config --cflags raylib opus miniaudio) \
            -I/ucrt64/include \
            -lraylib \
            -lenet \
            -lopus \
            -lopusfile \
            -lvorbis \
            -lvorbisfile \
            -lminiaudio \
            -lws2_32 \
            -lwinmm \
            -lgdi32 \
            -lopengl32

      - name: Test match rules
        shell: msys2 {0}
        run: |
          g++ -std=c++17 tests/rule_tests.cpp -o bin/rule_tests.exe
          bin/rule_tests.exe

      - name: Verify EXE
        shell: msys2 {0}
        run: |
          if [ ! -f bin/Rgamestudio.exe ]; then
            echo "ERROR: Rgamestudio.exe was not created."
            exit 1
          fi

          echo "Build successful!"
          ls -lh bin/Rgamestudio.exe

      - name: Prepare Release Package
        shell: msys2 {0}
        run: |
          rm -rf release_package
          mkdir -p release_package

          cp bin/Rgamestudio.exe release_package/

          if [ -d assets ]; then
            cp -r assets release_package/
          fi

          echo "Collecting required DLLs..."

          ldd bin/Rgamestudio.exe | grep '/ucrt64/bin' | awk '{print $3}' | while read dll; do
            if [ -f "$dll" ]; then
              cp "$dll" release_package/
            fi
          done

          echo "Release package:"
          find release_package -maxdepth 2 -type f

      - name: Create Release ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "Rgamestudio-$tag-windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "release_package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name,Length,FullName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Rgamestudio ${{ github.ref_name }}"
          body: |
            # Rgamestudio ${{ github.ref_name }}

            ## Download

            Download the Windows ZIP below and extract it.

            ## How to Play

            1. Download `Rgamestudio-${{ github.ref_name }}-windows.zip`
            2. Extract the ZIP.
            3. Open the extracted folder.
            4. Run `Rgamestudio.exe`.

            ## Requirements

            - Windows 10/11
            - 64-bit Windows

          files: |
            Rgamestudio-${{ github.ref_name }}-windows.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
