name: Windows EXE Release
on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-miniaudio
      - name: Build release
        shell: msys2 {0}
        run: |
          cmake -S . -B bin/release-build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build bin/release-build -j 4
          ctest --test-dir bin/release-build -R '^match_rules$' --output-on-failure
      - name: Package single EXE installer
        shell: pwsh
        run: ./tools/package_windows.ps1 -Version '1.0.0'
      - name: Save installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-1.0.0-Windows
          path: |
            bin/release/1.0.0/VANTA-1.0.0-Setup.exe
            bin/release/1.0.0/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' --title 'VANTA 1.0.0' --notes-file packaging/RELEASE_NOTES.md --latest
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          # Preserve existing downloads when a locally tested release was already published.
          $published = @(gh release view '${{ github.ref_name }}' --repo '${{ github.repository }}' --json assets --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect release assets.' }
          foreach ($file in @('bin/release/1.0.0/VANTA-1.0.0-Setup.exe', 'bin/release/1.0.0/SHA256SUMS.txt')) {
            $name = Split-Path -Leaf $file
            if ($published -contains $name) { Write-Host "Preserving existing $name"; continue }
            gh release upload '${{ github.ref_name }}' $file --repo '${{ github.repository }}'
            if ($LASTEXITCODE -ne 0) { throw "Release upload failed: $name" }
          }
